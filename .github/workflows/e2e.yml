name: E2E

# Split out of ci.yml because these tiers need credentials and device artifacts a pull-request gate
# cannot supply. ci.yml names the tiers it runs, so a tier added here is never silently gated there.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which E2E tier to run
        required: true
        default: api
        type: choice
        options: [api, ui, mobile, all]
  schedule:
    - cron: '0 3 * * *'

# A cancelled run leaves a half-torn-down fleet behind, so an in-flight run finishes rather than
# being replaced.
concurrency:
  group: customer-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      # Preconditions first: a missing credential is a named failure in seconds, not an exception
      # raised inside every fixture once the fleet is already up.
      - name: Check E2E preconditions
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          tier='${{ inputs.tier || 'api' }}'
          failed=0
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY is not configured. The Api and Ui tiers confirm real payment intents and cannot run without it."
            failed=1
          fi
          if [ "$tier" = 'mobile' ] || [ "$tier" = 'all' ]; then
            apk='tests/E2ETests/Concertable.Customer.E2ETests.Mobile/TestAssets/concertable-debug.apk'
            if [ ! -f "$apk" ]; then
              echo "::error::$apk is missing. Build it with 'npx expo prebuild --platform android' then gradlew assembleDebug (see the suite's SETUP.md); the Mobile tier cannot run without it."
              failed=1
            fi
          fi
          exit $failed

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_TOKEN }}
        run: dotnet restore Concertable.Customer.slnx

      - name: Build
        run: dotnet build Concertable.Customer.slnx --configuration Release --no-restore

      - name: Install Playwright browsers
        if: inputs.tier == 'ui' || inputs.tier == 'all' || inputs.tier == ''
        run: >-
          tests/E2ETests/Concertable.Customer.E2ETests.Ui/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
        shell: pwsh

      - name: Run E2E
        env:
          Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          tier='${{ inputs.tier || 'api' }}'
          case "$tier" in
            api)    filter='Category=Api' ;;
            ui)     filter='Category=Ui' ;;
            mobile) filter='Category=Mobile' ;;
            all)    filter='Category=Api|Category=Ui|Category=Mobile' ;;
          esac
          dotnet test Concertable.Customer.slnx --configuration Release --no-build --no-restore -m:1 --filter "$filter"
