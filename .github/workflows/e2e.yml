name: E2E

# Split out of ci.yml because these tiers need credentials and device artifacts a pull-request gate
# cannot supply. ci.yml names the tiers it runs, so a tier added here is never silently gated there.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which E2E tier to run
        required: true
        default: api
        type: choice
        options: [api, ui, mobile, all]
  schedule:
    - cron: '0 3 * * *'

# A cancelled run leaves a half-torn-down fleet behind, so an in-flight run finishes rather than
# being replaced.
concurrency:
  group: customer-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ || secrets.GITHUB_TOKEN }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
      EXPO_PUBLIC_AUTH_AUTHORITY: https://localhost:7093
      EXPO_PUBLIC_CUSTOMER_API_URL: https://localhost:7090
      EXPO_PUBLIC_PAYMENT_API_URL: https://localhost:7098
      EXPO_PUBLIC_OIDC_CLIENT_ID: customer-mobile
      EXPO_PUBLIC_URL_SCHEME: concertable-customer
      EXPO_PUBLIC_STRIPE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Check E2E preconditions
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          tier='${{ inputs.tier || 'api' }}'
          failed=0
          if [ -z "$GITHUB_PACKAGES_TOKEN" ]; then
            echo "::error::CONCERTABLE_PACKAGES_READ is not configured."
            failed=1
          fi
          if [ -z "$GoogleApiKey" ]; then
            echo "::error::GOOGLE_API_KEY is not configured."
            failed=1
          fi
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY is not configured. The Api and Ui tiers confirm real payment intents and cannot run without it."
            failed=1
          fi
          if { [ "$tier" = 'mobile' ] || [ "$tier" = 'all' ]; } && [ -z "$EXPO_PUBLIC_STRIPE_KEY" ]; then
            echo "::error::STRIPE_PUBLISHABLE_KEY is not configured."
            failed=1
          fi
          exit $failed

      - name: Generate service credentials
        run: |
          for name in ServiceAuth__B2BClientSecret ServiceAuth__CustomerClientSecret ServiceAuth__AuthClientSecret; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision HTTPS dev certificate
        run: |
          dotnet dev-certs https --trust || true
          mkdir -p artifacts/https
          dotnet dev-certs https -ep artifacts/https/aspnet-dev-cert.pem --format Pem --no-password
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        uses: ./.github/actions/setup-stripe-cli

      - name: Install Azure Functions Core Tools
        run: |
          npm install -g azure-functions-core-tools@4.12.1 --unsafe-perm true
          func --version

      - name: Set up Node
        if: inputs.tier == 'ui' || inputs.tier == 'mobile' || inputs.tier == 'all'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        if: inputs.tier == 'ui' || inputs.tier == 'mobile' || inputs.tier == 'all'
        run: npm ci

      - name: Build frontend package dependencies
        if: inputs.tier == 'ui' || inputs.tier == 'all'
        run: npm run build:shared

      - name: Build mobile APK
        if: inputs.tier == 'mobile' || inputs.tier == 'all'
        working-directory: app/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleDebug
          mkdir -p ../../../tests/E2ETests/Concertable.Customer.E2ETests.Mobile/TestAssets
          cp app/build/outputs/apk/debug/app-debug.apk ../../../tests/E2ETests/Concertable.Customer.E2ETests.Mobile/TestAssets/concertable-debug.apk

      - name: Install Appium
        if: inputs.tier == 'mobile' || inputs.tier == 'all'
        run: |
          npm install --global appium@2.19.0
          appium driver install uiautomator2@4.2.9

      - name: Build mobile E2E
        if: inputs.tier == 'mobile' || inputs.tier == 'all'
        run: >-
          dotnet build tests/E2ETests/Concertable.Customer.E2ETests.Mobile/Concertable.Customer.E2ETests.Mobile.csproj
          --configuration Release

      - name: Build UI E2E
        if: inputs.tier == 'ui' || inputs.tier == 'all'
        run: >-
          dotnet build tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj
          --configuration Release

      - name: Install Playwright browsers
        if: inputs.tier == 'ui' || inputs.tier == 'all'
        run: >-
          tests/E2ETests/Concertable.Customer.E2ETests.Ui/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
        shell: pwsh

      - name: Run API E2E
        if: inputs.tier == 'api' || inputs.tier == 'all' || inputs.tier == ''
        run: >-
          dotnet test tests/E2ETests/Concertable.Customer.E2ETests/Concertable.Customer.E2ETests.csproj
          --configuration Release -m:1

      - name: Run UI E2E
        if: inputs.tier == 'ui' || inputs.tier == 'all'
        run: >-
          dotnet test tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj
          --configuration Release --no-build --no-restore -m:1

      - name: Run mobile E2E
        if: inputs.tier == 'mobile' || inputs.tier == 'all'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: ConcertableTest
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          script: |
            cert_hash=$(openssl x509 -inform PEM -subject_hash_old -in artifacts/https/aspnet-dev-cert.pem -noout | head -1)
            cp artifacts/https/aspnet-dev-cert.pem "/tmp/$cert_hash.0"
            adb root
            adb remount
            adb push "/tmp/$cert_hash.0" "/system/etc/security/cacerts/$cert_hash.0"
            adb shell chmod 644 "/system/etc/security/cacerts/$cert_hash.0"
            adb reboot
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb reverse tcp:7090 tcp:7090
            adb reverse tcp:7093 tcp:7093
            adb reverse tcp:7098 tcp:7098
            adb reverse tcp:8081 tcp:8081
            CI=1 npm --workspace @concertable/mobile-customer exec -- expo start --port 8081 --host localhost > artifacts/mobile-metro.log 2>&1 &
            until curl --silent --fail http://localhost:8081/status > /dev/null; do sleep 2; done
            dotnet test tests/E2ETests/Concertable.Customer.E2ETests.Mobile/Concertable.Customer.E2ETests.Mobile.csproj --configuration Release --no-build --no-restore -m:1

      - name: Retain E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: customer-e2e-diagnostics-${{ inputs.tier || 'api' }}
          path: |
            **/e2e-diagnostics.log
            **/TestResults/*.trx
            **/playwright-traces/**
            **/playwright-failures/**
            mobile-traces/**
            artifacts/mobile-metro.log
          if-no-files-found: warn
