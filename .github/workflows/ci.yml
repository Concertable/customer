name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  GITHUB_PACKAGES_TOKEN: ${{ github.token }}
  DOTNET_NOLOGO: true

jobs:
  backend:
    name: Backend, tests, packages, and image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore CarveCustomer.slnx

      - name: Build backend
        run: dotnet build CarveCustomer.slnx --configuration Release --no-restore

      - name: Test backend
        # Integration projects each own a Testcontainers SQL fixture. Serialize project execution so
        # seven assemblies do not race Docker startup on the same runner.
        run: dotnet test CarveCustomer.slnx --configuration Release --no-build --no-restore -m:1

      - name: Validate migration snapshots
        shell: pwsh
        run: ./scripts/validate-migrations.ps1

      - name: Pack Customer-owned packages
        run: dotnet pack CarveCustomer.slnx --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Verify package candidates from a clean consumer
        shell: pwsh
        run: ./scripts/verify-package-candidates.ps1 -PackageDirectory artifacts/packages

      - name: Build Customer Web image candidate
        run: |
          mkdir -p artifacts/images
          dotnet publish src/Concertable.Customer.Web/Concertable.Customer.Web.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerImageTag=${{ github.sha }} \
            -p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/images/customer-web.tar.gz

      - name: Build Customer migrations image candidate
        run: |
          dotnet publish src/Concertable.Customer.Migrations/Concertable.Customer.Migrations.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerImageTag=${{ github.sha }} \
            -p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/images/customer-migrations.tar.gz

      - name: Verify Customer migration job on an empty database
        shell: pwsh
        run: ./scripts/verify-migration-job.ps1 -Configuration Release

      - name: Verify image candidates
        run: |
          test -s artifacts/images/customer-web.tar.gz
          test -s artifacts/images/customer-migrations.tar.gz

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Test and build shared package
        run: npm run build:shared

      - name: Test web app
        run: npm -w @concertable/web-customer test

      - name: Build web app
        run: npm run build:web

      - name: Typecheck and export mobile app
        run: npm run build:mobile
