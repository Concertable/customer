name: CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated v-prefixed tag to validate; this workflow never publishes
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ || secrets.GITHUB_TOKEN }}
  DOTNET_NOLOGO: true
  CANDIDATE_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

jobs:
  backend:
    name: Backend, tests, packages, and image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Validate manual release ref
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          ./scripts/validate-promotion-config.ps1
          -ReleaseTag $env:RELEASE_TAG
          -ExpectedCommit $env:EXPECTED_COMMIT

      - name: Restore backend
        run: dotnet restore Concertable.Customer.slnx

      # The tier gate arrives through an import in Directory.Build.targets. A wrong path there does
      # not fail a build, it just stops enforcing, so assert the gate resolved rather than that its
      # file is on disk.
      - name: Verify the test-tier gate is enforced
        shell: pwsh
        run: |
          $tier = (dotnet msbuild api/src/Modules/Ticket/Tests/Concertable.Customer.Ticket.UnitTests/Concertable.Customer.Ticket.UnitTests.csproj -getProperty:ConcertableTestTier -nologo).Trim()
          if ($tier -ne 'Unit') {
            throw "Test-tier gate is not enforced: ConcertableTestTier resolved to '$tier' instead of 'Unit'. TestConventions.targets is present but not imported, or its import path is wrong."
          }
          Write-Host "Test-tier gate enforced (ConcertableTestTier = $tier)."

      - name: Build backend
        run: dotnet build Concertable.Customer.slnx --configuration Release --no-restore

      - name: Test backend
        # Integration projects each own a Testcontainers SQL fixture. Serialize project execution so
        # seven assemblies do not race Docker startup on the same runner.
        # The tiers are named rather than the E2E ones excluded: an exclusion list stops protecting
        # the gate the moment a tier appears that nobody remembered to exclude. E2E runs in e2e.yml,
        # which owns the Stripe and Appium preconditions this gate cannot satisfy.
        run: >-
          dotnet test Concertable.Customer.slnx --configuration Release --no-build --no-restore -m:1
          --filter "Category=Unit|Category=Integration|Category=Architecture|Category=Startup"

      - name: Validate migration snapshots
        shell: pwsh
        run: ./scripts/validate-migrations.ps1

      - name: Pack Customer-owned packages
        run: dotnet pack Concertable.Customer.slnx --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Verify package candidates from a clean consumer
        shell: pwsh
        run: ./scripts/verify-package-candidates.ps1 -PackageDirectory artifacts/packages

      - name: Build Customer Web image candidate
        run: |
          mkdir -p artifacts/images
          dotnet publish api/src/Concertable.Customer.Web/Concertable.Customer.Web.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerImageTag="$CANDIDATE_IMAGE_TAG" \
            -p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/images/customer-web.tar.gz

      - name: Build Customer migrations image candidate
        run: |
          dotnet publish api/src/Concertable.Customer.Migrations/Concertable.Customer.Migrations.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerImageTag="$CANDIDATE_IMAGE_TAG" \
            -p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/images/customer-migrations.tar.gz

      - name: Build Customer seed simulator image candidate
        run: |
          dotnet publish api/src/Seed/Concertable.Customer.Seed.Simulator/Concertable.Customer.Seed.Simulator.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerImageTag="$CANDIDATE_IMAGE_TAG" \
            -p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/images/customer-seed-simulator.tar.gz

      - name: Smoke Customer seed simulator image candidate
        run: |
          docker load --input artifacts/images/customer-seed-simulator.tar.gz
          docker run --rm "concertable/customer-seed-simulator:$CANDIDATE_IMAGE_TAG" --SeedSimulator:Smoke=true

      - name: Verify Customer migration job on an empty database
        shell: pwsh
        run: ./scripts/verify-migration-job.ps1 -Configuration Release

      - name: Verify image candidates
        run: |
          test -s artifacts/images/customer-web.tar.gz
          test -s artifacts/images/customer-migrations.tar.gz
          test -s artifacts/images/customer-seed-simulator.tar.gz

      - name: Validate promotion candidate selection
        shell: pwsh
        env:
          EXPECTED_IMAGE_TAG: ${{ env.CANDIDATE_IMAGE_TAG }}
        run: >-
          ./scripts/validate-promotion-config.ps1
          -PackageDirectory artifacts/packages
          -ImageDirectory artifacts/images
          -ExpectedImageTag $env:EXPECTED_IMAGE_TAG

      - name: Validate manual release gate
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          ./scripts/validate-promotion-config.ps1
          -PackageDirectory artifacts/packages
          -ImageDirectory artifacts/images
          -ExpectedImageTag $env:RELEASE_TAG
          -ReleaseTag $env:RELEASE_TAG
          -ExpectedCommit $env:EXPECTED_COMMIT

      - name: Verify and inventory candidate integrity
        shell: pwsh
        run: >-
          ./scripts/verify-artifact-integrity.ps1
          -PackageDirectory artifacts/packages
          -ImageDirectory artifacts/images
          -EvidenceDirectory artifacts/integrity

      - name: Retain candidate integrity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: customer-candidate-integrity-${{ github.sha }}
          path: artifacts/integrity
          if-no-files-found: error
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Test and build shared package
        run: npm run build:shared

      - name: Test web app
        run: npm -w @concertable/web-customer test

      - name: Build web app
        run: npm run build:web

      - name: Typecheck and export mobile app
        run: npm run build:mobile
